name: Sync Local Music Playlist

on:
  push:
    paths:
      - 'music/**' # 当 music 文件夹有音乐增减时自动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Playlist from Music Folder
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const musicDir = path.join(".", "music");
            const AUDIO_EXTENSIONS = [".mp3", ".wav", ".flac", ".m4a", ".aac", ".ogg", ".opus"];

            if (!fs.existsSync(musicDir)) {
              console.log("未找到 music 文件夹，创建空列表。");
              fs.writeFileSync("playlist.json", JSON.stringify([], null, 2));
              process.exit(0);
            }

            // 递归或直接读取 music 目录下的文件
            const files = fs.readdirSync(musicDir);
            const playlist = [];

            // 请将下面这行中的 chincyan-ui/drive-music-data 替换为你自己的【GitHub用户名/仓库名】
            const repoOwnerAndName = "chincyan-ui/drive-music-data"; 

            for (const file of files) {
              const lowerName = file.toLowerCase();
              const hasValidExt = AUDIO_EXTENSIONS.some(ext => lowerName.endsWith(ext));
              
              if (hasValidExt) {
                // 拼装 GitHub Raw 绝对直链（100% 可被 Android MediaPlayer 直接流式播放）
                // 对文件名进行编码以防包含空格或特殊字符
                const encodedFileName = encodeURIComponent(file);
                const downloadUrl = `https://raw.githubusercontent.com/${repoOwnerAndName}/main/music/${encodedFileName}`;
                
                playlist.push({
                  name: file,
                  downloadUrl: downloadUrl
                });
              }
            }

            fs.writeFileSync("playlist.json", JSON.stringify(playlist, null, 2));
            console.log(`成功生成包含 ${playlist.length} 首歌曲的播放列表。`);
          '

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist.json from music folder" && git push)
